<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Changed — Legal Case Management</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f2f2f2;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      .container {
        max-width: 600px;
        margin: 30px auto;
        background-color: #ffffff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      .header {
        background-color: #0939e5ff;
        text-align: center;
        padding: 30px 20px;
      }

      .header img {
        width: 100px;
        height: auto;
        display: block;
        margin: 0 auto 10px;
      }

      .header h2 {
        margin: 0;
        font-size: 22px;
        color: #ffffff;
        letter-spacing: 1px;
      }

      .content {
        padding: 30px 40px;
        color: #333333;
        line-height: 1.6;
        font-size: 16px;
      }

      .content p {
        margin-bottom: 16px;
      }

      .footer {
        background-color: #111111;
        color: #ffffff;
        text-align: center;
        padding: 15px;
        font-size: 12px;
      }

      @media only screen and (max-width: 600px) {
        .content {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img src="cid:cicmslogo" alt="CICMS Logo" width="100" />
        <h2>Construction Insurance Claim Management</h2>
      </div>
      <div class="content">
        <p>Hello <strong>{{name}}</strong>,</p>
        <p>
          This is a confirmation that your password has been changed
          successfully.
        </p>        
        <p>
          If you did not perform this change, please contact our support team
          immediately.
        </p>
        <p>Best regards,<br />SODIMEX Team</p>
      </div>
      <div class="footer">&copy; {{year}} SODIMEX. All rights reserved.</div>
    </div>
  </body>
</html>
